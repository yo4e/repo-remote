name: Repo Remote

on:
  issues:
    types: [edited, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: repo-remote-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply authorized command
    if: >-
      github.run_attempt == '1' &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'repo-remote:command') &&
      (
        github.event.issue.user.login == github.repository_owner ||
        contains(fromJSON(vars.ALLOWED_ACTORS || '[]'), github.event.issue.user.login)
      ) &&
      (
        github.actor == github.repository_owner ||
        contains(fromJSON(vars.ALLOWED_ACTORS || '[]'), github.actor)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Capture bounded audit evidence
        id: evidence
        env:
          OWNER: ${{ github.repository_owner }}
          COMMAND_BODY: ${{ github.event.issue.body }}
        run: node scripts/audit.mjs

      - name: Validate command before exposing the PAT
        id: validate
        env:
          OWNER: ${{ github.repository_owner }}
          COMMAND_BODY: ${{ github.event.issue.body }}
        run: node scripts/validate-command-cli.mjs

      - name: Execute dry run without PAT
        if: steps.validate.outputs.dry_run == 'true'
        id: dry_run
        env:
          OWNER: ${{ github.repository_owner }}
          COMMAND_BODY: ${{ github.event.issue.body }}
        run: node scripts/apply-command.mjs

      - name: Apply command with PAT
        if: steps.validate.outputs.dry_run != 'true'
        id: apply
        env:
          OWNER: ${{ github.repository_owner }}
          REMOTE_TOKEN: ${{ secrets.REPO_REMOTE_TOKEN }}
          COMMAND_BODY: ${{ github.event.issue.body }}
        run: node scripts/apply-command.mjs

      - name: Report success and close Issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUMMARY: ${{ steps.apply.outputs.summary || steps.dry_run.outputs.summary }}
          REPORT: ${{ steps.apply.outputs.report || steps.dry_run.outputs.report }}
          TARGET: ${{ steps.validate.outputs.target }}
          OPERATION: ${{ steps.validate.outputs.operation }}
          CHANGED: ${{ steps.validate.outputs.changed }}
          DRY_RUN: ${{ steps.validate.outputs.dry_run }}
          FINGERPRINT: ${{ steps.evidence.outputs.fingerprint }}
          BODY_BYTES: ${{ steps.evidence.outputs.body_bytes }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          RESULT="${REPORT:-$SUMMARY}"
          COMMENT_FILE="${RUNNER_TEMP}/repo-remote-success.md"
          {
            printf '%s\n\n' '✅ repo-remote command succeeded'
            printf -- '- Target: `%s`\n' "$TARGET"
            printf -- '- Operation: `%s`\n' "$OPERATION"
            printf -- '- Dry run: `%s`\n' "$DRY_RUN"
            printf -- '- Changed resources: `%s`\n' "$CHANGED"
            printf -- '- Payload fingerprint: `%s`\n' "$FINGERPRINT"
            printf -- '- Payload bytes: `%s`\n' "$BODY_BYTES"
            printf -- '- Actions run: %s\n' "$RUN_URL"
            printf '\n### Result\n%s\n' "$RESULT"
          } > "$COMMENT_FILE"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$COMMENT_FILE"
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_HINT: ${{ steps.evidence.outputs.target_hint }}
          OPERATION_HINT: ${{ steps.evidence.outputs.operation_hint }}
          CHANGED_HINT: ${{ steps.evidence.outputs.changed_hint }}
          DRY_RUN_HINT: ${{ steps.evidence.outputs.dry_run_hint }}
          FINGERPRINT: ${{ steps.evidence.outputs.fingerprint }}
          BODY_BYTES: ${{ steps.evidence.outputs.body_bytes }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          COMMENT_FILE="${RUNNER_TEMP}/repo-remote-failure.md"
          {
            printf '%s\n\n' '❌ repo-remote command failed'
            printf -- '- Target hint (unvalidated): `%s`\n' "${TARGET_HINT:-unavailable}"
            printf -- '- Operation hint (unvalidated): `%s`\n' "${OPERATION_HINT:-unavailable}"
            printf -- '- Dry run hint (unvalidated): `%s`\n' "${DRY_RUN_HINT:-unknown}"
            printf -- '- Changed-resource hint (unvalidated): `%s`\n' "${CHANGED_HINT:-unavailable}"
            printf -- '- Payload fingerprint: `%s`\n' "${FINGERPRINT:-unavailable}"
            printf -- '- Payload bytes: `%s`\n' "${BODY_BYTES:-unknown}"
            printf -- '- Actions run: %s\n\n' "$RUN_URL"
            printf '%s\n' 'Validation or execution details are kept in the Actions log; the Issue comment does not echo the full command payload or credentials.'
          } > "$COMMENT_FILE"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$COMMENT_FILE"
